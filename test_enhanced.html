<!DOCTYPE html>
<html>
<head>
    <title>Enhanced Parser Test</title>
    <script src="js/parser.js"></script>
    <script src="js/locations.js"></script>
</head>
<body>
    <h3>Testing Enhanced Parser - Time & Fare Logic</h3>
    <div id="results"></div>

    <script>
        // Test the new parsing logic
        const testText1 = `Pickup at 12.00 clock
Drop off at BN11 4NS
fare 75`;

        const testText2 = `Meeting at 12.00 o'clock
Fare: £60
From LHR to SW1A`;

        console.log("Testing parser with text 1:", testText1);
        console.log("Testing parser with text 2:", testText2);

        // Test time parsing for 12.00 format
        const timePattern = /\b(\d{1,2}\.\d{2})\s*(?:clock|o'clock)?\b/i;
        const timeMatch1 = testText1.match(timePattern);
        const timeMatch2 = testText2.match(timePattern);
        
        console.log("Time match 1:", timeMatch1);
        console.log("Time match 2:", timeMatch2);

        // Test fare parsing
        const farePattern = /\bfare\s+(\d+(?:\.\d{2})?)?\b/i;
        const farePattern2 = /fare[\s\-]*£(\d+(?:\.\d{2})?)/i;
        const fareMatch1 = testText1.match(farePattern);
        const fareMatch2 = testText2.match(farePattern2);
        
        console.log("Fare match 1:", fareMatch1);
        console.log("Fare match 2:", fareMatch2);

        document.getElementById('results').innerHTML = 
            '<h4>Test Results:</h4>' +
            '<p><strong>Text 1:</strong> ' + testText1 + '</p>' +
            '<p>Time: ' + (timeMatch1 ? timeMatch1[1].replace('.', ':') : 'Not found') + '</p>' +
            '<p>Fare: £' + (fareMatch1 ? fareMatch1[1] : 'Not found') + '</p>' +
            '<hr>' +
            '<p><strong>Text 2:</strong> ' + testText2 + '</p>' +
            '<p>Time: ' + (timeMatch2 ? timeMatch2[1].replace('.', ':') : 'Not found') + '</p>' +
            '<p>Fare: £' + (fareMatch2 ? fareMatch2[1] : 'Not found') + '</p>';
    </script>
</body>
</html>
